[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orie5270-bdt"
version = "0.1.0"
description = "Reusable Python package for the ORIE 5270 Big Data Technology multi-factor trading strategy project."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "ORIE 5270 Big Data Technology Project Team"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "statsmodels>=0.13",
  "scipy>=1.9",
  "matplotlib>=3.6"
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
orie5270-fit = "orie5270_bdt.cli:fit_command"
orie5270-backtest = "orie5270_bdt.cli:backtest_command"

[tool.setuptools.packages.find]
where = ["."]
include = ["orie5270_bdt*"]

[tool.ruff]
line-length = 100
